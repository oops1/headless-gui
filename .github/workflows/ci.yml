# CI headless-gui: сборка, тесты (включая golden-снапшоты рендера) на трёх ОС,
# кросс-компиляция и smoke-прогон бенчмарков.
#
# Движок рендерит на CPU без экрана — тесты не требуют дисплея/Xvfb.
name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./engine/ ./tests/

      # Пиксельные эталоны при расхождении сохраняют полученный кадр во
      # временную директорию — выгружаем для разбора.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-got-${{ matrix.os }}
          path: ${{ runner.temp }}/golden_got_*.png
          if-no-files-found: ignore

      # -unsafeptr=false: Win32-код (wndProc lparam→указатель, clipboard)
      # легитимно преобразует uintptr в указатели — unsafeptr-анализатор
      # флагует этот канонический для WinAPI паттерн. Остальные проверки vet
      # действуют в полном объёме.
      - name: Vet
        run: go vet -unsafeptr=false ./...

  # Векторные пиксельные ядра (internal/pixsimd) на экспериментальном
  # simd/archsimd: собираются только с GOEXPERIMENT=simd. Проверки «вектор =
  # скаляр бит в бит» и эталонные кадры имеют смысл лишь в этой сборке, поэтому
  # у неё своя задача. PIXSIMD_REQUIRE=avx2 не даёт ей пройти молча на
  # скалярном пути, если векторный файл не попал в сборку.
  simd:
    name: test (GOEXPERIMENT=simd)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
      PIXSIMD_REQUIRE: avx2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Test pixsimd (verbose)
        run: go test -v -run 'Impl|Matches|Exhaustive|Div65535' ./internal/pixsimd/
      - name: Test (race)
        run: go test -race ./internal/... ./engine/ ./tests/
      - name: Vet
        run: go vet -unsafeptr=false ./...
      # На других архитектурах векторный файл в сборку не входит — проверяем,
      # что теги сборки это обеспечивают и пакет собирается скалярным.
      - name: Cross-compile with the experiment
        run: |
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  crosscompile:
    name: cross-compile (zero CGO)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...
      - name: linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...
      - name: darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./...
      - name: darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...

  bench:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Bench 1x
        run: go test ./engine/ -run XXX -bench . -benchtime 1x
